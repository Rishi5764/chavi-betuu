<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Chavi ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="hearts"></div>

<section class="hero">

<div class="glass">

<h2>💌 A Special Surprise</h2>

<h1>Dear Chavi ❤️</h1>

<p>
Someone wants to tell you something
from the bottom of their heart...
</p>

<button id="start">
Open Letter 💖
</button>

</div>

</section>

<section class="letter" id="letter">

<img src="photo.jpg.jpeg" class="photo">

<div class="card">

<h2>💖 My Letter 💖</h2>

<p id="typing"></p>

<button id="next">
Continue 🌸
</button>

</div>

</section>

<section class="final" id="final">

<h1>❤️ Best Friends Forever ❤️</h1>

<h2>

No matter what happens...

I'll always be with you
as your best friend.

</h2>

<h3>

Rishi ❤️ Chavi

</h3>

</section>

<script src="script.js"></script>
<button id="musicBtn">🎵 Music</button>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
</body>
</html>
