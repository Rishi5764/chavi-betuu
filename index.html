<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>For Chavi ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="loader">

<h1>💖</h1>

<h2>Loading a Special Surprise...</h2>

</div>

<div id="hearts"></div>

<section class="hero">

<img src="photo.jpg" class="photo">

<h1>Dear Chavi ❤️</h1>

<p class="quote">
A special message from someone
who truly cares about you.
</p>

<button id="openBtn">
Open My Letter 💌
</button>

</section>

<section class="letter" id="letter">

<div class="glass">

<h2>💖 My Letter 💖</h2>

<p id="typing"></p>

<button id="next">
Continue ❤️
</button>

</div>

</section>

<section class="final" id="final">

<h1>🌸 Best Friends Forever 🌸</h1>

<h2>

No matter what happens...

I'll always be with you
as your best friend.

</h2>

<h3>

❤️
Rishi & Chavi
❤️

</h3>

<div id="fireworks"></div>

</section>

<audio id="music" loop>

<source src="music.mp3">

</audio>

<script src="script.js"></script>

</body>
</html>
